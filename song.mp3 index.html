<!-- Background Audio -->
<audio id="bg-music" loop>
  <source src="song.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

<script>
  document.addEventListener('click', function () {
    const audio = document.getElementById('bg-music');
    if (audio.paused) {
      audio.play();
    }
  }, { once: true });
</script>
